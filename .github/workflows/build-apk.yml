name: Build Pak Status & Video Saver APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web app
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor Android & Unity Ads
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Pak Status & Video Saver" "com.pakfintechs.videosaver" --web-dir=dist
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Inject Unity Ads SDK & MainActivity Bridge
        run: |
          if ! grep -q "com.unity3d.ads:unity-ads" android/app/build.gradle; then
            sed -i "/dependencies {/a \    implementation 'com.unity3d.ads:unity-ads:4.12.5'" android/app/build.gradle
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <application/' "$MANIFEST"
          fi
          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          PKG_LINE=$(grep "^package " "$MAIN_ACT")

          cat <<EOF > "$MAIN_ACT"
          $PKG_LINE

          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import com.unity3d.ads.*;

          public class MainActivity extends BridgeActivity {
              private static final String UNITY_GAME_ID = "800452851";
              private static final String REWARDED_AD_UNIT = "BP_Rewarded_Android";
              private static final String INTERSTITIAL_AD_UNIT = "BP_Interstitial_Android";
              private static final boolean TEST_MODE = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  UnityAds.initialize(getApplicationContext(), UNITY_GAME_ID, TEST_MODE, new IUnityAdsInitializationListener() {
                      @Override
                      public void onInitializationComplete() {
                          loadRewardedAd();
                          loadInterstitialAd();
                      }

                      @Override
                      public void onInitializationFailed(UnityAdsInitializationError error, String message) {}
                  });

                  this.bridge.getWebView().addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void showRewardedVideo() {
                          runOnUiThread(() -> {
                              UnityAds.show(MainActivity.this, REWARDED_AD_UNIT, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                                  @Override
                                  public void onUnityAdsShowComplete(String placementId, UnityAdsShowCompletionState state) {
                                      loadRewardedAd();
                                      bridge.getWebView().evaluateJavascript("if(window.onUnityAdCompleted) window.onUnityAdCompleted();", null);
                                  }

                                  @Override
                                  public void onUnityAdsShowFailure(String placementId, UnityAdsShowFailure error, String message) {
                                      loadRewardedAd();
                                      bridge.getWebView().evaluateJavascript("if(window.onUnityAdFailed) window.onUnityAdFailed();", null);
                                  }

                                  @Override
                                  public void onUnityAdsShowStart(String placementId) {}

                                  @Override
                                  public void onUnityAdsShowClick(String placementId) {}
                              });
                          });
                      }

                      @JavascriptInterface
                      public void showInterstitialVideo() {
                          runOnUiThread(() -> {
                              UnityAds.show(MainActivity.this, INTERSTITIAL_AD_UNIT, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                                  @Override
                                  public void onUnityAdsShowComplete(String placementId, UnityAdsShowCompletionState state) {
                                      loadInterstitialAd();
                                  }

                                  @Override
                                  public void onUnityAdsShowFailure(String placementId, UnityAdsShowFailure error, String message) {
                                      loadInterstitialAd();
                                  }

                                  @Override
                                  public void onUnityAdsShowStart(String placementId) {}

                                  @Override
                                  public void onUnityAdsShowClick(String placementId) {}
                              });
                          });
                      }
                  }, "AndroidAds");
              }

              private void loadRewardedAd() {
                  UnityAds.load(REWARDED_AD_UNIT, new IUnityAdsLoadListener() {
                      @Override
                      public void onUnityAdsAdLoaded(String placementId) {}
                      @Override
                      public void onUnityAdsFailedToLoad(String placementId, UnityAdsLoadError error, String message) {}
                  });
              }

              private void loadInterstitialAd() {
                  UnityAds.load(INTERSTITIAL_AD_UNIT, new IUnityAdsLoadListener() {
                      @Override
                      public void onUnityAdsAdLoaded(String placementId) {}
                      @Override
                      public void onUnityAdsFailedToLoad(String placementId, UnityAdsLoadError error, String message) {}
                  });
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pak-Status-Video-Saver-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
